# Project gradle properties for SkyRide (claude/build)
# Enable AndroidX for Compose and AndroidX libraries
android.useAndroidX=true
# Suppress unsupported compileSdk warning if using compileSdk 35
android.suppressUnsupportedCompileSdk=35
## Gradle JVM settings to avoid Daemon thrashing on low-memory machines
org.gradle.jvmargs=-Xmx2g -Dkotlin.daemon.jvm.options=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true

