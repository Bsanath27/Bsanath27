<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Terrain Map - Cesium.js</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #cesiumContainer {
      width: 100%;
      height: 100%;
    }

    .info-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      max-width: 300px;
      z-index: 1000;
    }

    .info-panel h1 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #333;
    }

    .info-panel p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .info-panel .version {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="info-panel">
    <h1>🌍 3D Terrain Map</h1>
    <p>Interactive 3D globe with terrain rendering powered by Cesium.js</p>
    <div class="version">v0.1.0</div>
  </div>
  <div id="cesiumContainer"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
